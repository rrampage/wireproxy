name: Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions: {}

jobs:
  cross-compile:
    name: Cross-compile check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # Compile-only check (no artifacts) for every release target. Keep the
      # list in sync with the targets in wireproxy.yml.
      - name: Cross-compile
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail

          targets=(
            linux/amd64
            linux/arm64
            linux/riscv64
            darwin/amd64
            darwin/arm64
            windows/amd64
          )

          for target in "${targets[@]}"; do
            echo "== $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./...
          done
